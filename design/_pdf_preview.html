<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>PDF → Image</title>
</head>
<body style="margin:0;background:#333">
<canvas id="c"></canvas>
<p id="s" style="color:white;font:14px sans-serif;padding:10px">Loading…</p>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.min.js"></script>
<script>
const workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.worker.min.js';
pdfjsLib.GlobalWorkerOptions.workerSrc = workerSrc;

fetch('uploads/Vue manager.pdf')
  .then(r => { document.getElementById('s').textContent = 'Fetched ' + r.status; return r.arrayBuffer(); })
  .then(buf => {
    document.getElementById('s').textContent = 'Parsing PDF…';
    return pdfjsLib.getDocument({ data: new Uint8Array(buf) }).promise;
  })
  .then(async pdf => {
    document.getElementById('s').textContent = `Pages: ${pdf.numPages}`;
    const page = await pdf.getPage(1);
    const scale = 2;
    const vp = page.getViewport({ scale });
    const canvas = document.getElementById('c');
    canvas.width = vp.width;
    canvas.height = vp.height;
    canvas.style.width = '100%';
    const ctx = canvas.getContext('2d');
    ctx.fillStyle = 'white';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    const renderCtx = { canvasContext: ctx, viewport: vp, background: 'white' };
    await page.render(renderCtx).promise;
    document.getElementById('s').textContent = 'Done!';
  })
  .catch(e => { document.getElementById('s').textContent = 'Error: ' + e; console.error(e); });
</script>
</body>
</html>
